line-length = 150
target-version = "py312"

# The template is copied verbatim into generated projects; it holds no Python.
extend-exclude = ["skills/gtk-rs-new-app/assets/template"]

[lint]
# Ruff always enables E and F by default; we extend that set.
extend-select = [
    "I", # import sorting (isort)
    "PL", # pylint-compatible rules (subset)
    "UP", # pyupgrade
    "B", # bugbear
    "SIM", # flake8-simplify
    "C4", # comprehensions
    "ERA", # eradicate (commented-out code)
    "W", # pycodestyle warnings
    "RUF", # Ruff-specific rules
]

ignore = [
    # add ignores as needed
]

[lint.per-file-ignores]
# The generator carries a shebang for the reader, but its documented invocation is
# `python3 -I .../new_app.py` (isolated mode, see the gtk-rs-new-app skill), so it is not executable.
"skills/gtk-rs-new-app/scripts/new_app.py" = ["EXE001"]
# Tests use bare asserts and literal values by design.
"tests/**" = ["PLR2004", "S101"]

[lint.pylint]
allow-magic-value-types = ["str", "int"]

[format]
quote-style = "double"
