default_install_hook_types: [pre-commit, commit-msg]

# The new-app template is copied verbatim into generated projects. Its YAML holds {{TOKEN}}
# placeholders that are not valid YAML until the generator substitutes them, so the YAML and
# Markdown hooks skip it; the generated project is linted and built by `make template-check`
# and the template-check CI job instead.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        exclude: ^skills/gtk-rs-new-app/assets/template/
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        # Run as `python3 -I .../new_app.py` (isolated mode), never by its own path.
        exclude: ^skills/gtk-rs-new-app/scripts/new_app\.py$
  - repo: https://github.com/checkmake/checkmake.git
    rev: v0.3.2
    hooks:
      - id: checkmake
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        additional_dependencies:
          # pytest ships py.typed; without it every @fixture and @parametrize is an
          # untyped decorator and mypy reports the test it decorates as untyped.
          - pytest==9.1.1
      - id: mypy
        alias: mypy-json-output
        name: mypy (json output)
        additional_dependencies:
          - pytest==9.1.1
        args:
          [
            "--output",
            "json",
            "--hide-error-context",
            "--show-column-numbers",
            "--show-absolute-path",
            "--no-pretty",
            "--ignore-missing-imports",
            "--scripts-are-modules",
          ]
        stages: [manual]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
      - id: ruff-check
        alias: ruff-check-rdjson
        args: ["--fix", "-q", "--output-format=rdjson"]
        stages: [manual]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint
        files: ^\.github/workflows/.*\.(yml|yaml)$
        args: ["-shellcheck", "shellcheck -S error"]
      - id: actionlint
        alias: actionlint-oneline
        name: actionlint (one line per one error)
        files: ^\.github/workflows/.*\.(yml|yaml)$
        args: ["-oneline", "-shellcheck", "shellcheck -S error"]
        stages: [manual]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        exclude: ^skills/gtk-rs-new-app/assets/template/
        additional_dependencies:
          - markdownlint-rule-table-format@1.0.3
  # Pinned rather than taken from the system, so a developer machine and CI run the same release.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-x"]
      - id: shellcheck
        alias: shellcheck-diff-output
        name: shellcheck (diff output)
        args: ["-f", "diff", "-x"]
        stages: [manual]
      - id: shellcheck
        alias: shellcheck-json-output
        name: shellcheck (json output)
        args: ["-f", "json", "-x"]
        stages: [manual]
  - repo: local
    hooks:
      - id: prettier-yaml
        name: prettier-yaml
        entry: prettier
        language: node
        additional_dependencies: ["prettier@3.9.9"]
        files: \.(yml|yaml)$
        exclude: ^skills/gtk-rs-new-app/assets/template/
        args: ["--write"]
      # Every source file carries the MIT header. Reads the whole tree, so it always runs; pinned
      # to one stage because always_run makes a hook eligible at every installed stage, and
      # commit-msg is one of them.
      - id: check-license-headers
        name: licence headers
        entry: scripts/check-license-headers.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        exclude: ^skills/gtk-rs-new-app/assets/template/
      - id: yamllint
        alias: yamllint-parsable
        name: "yamllint (parsable output)"
        args: ["--format", "parsable"]
        exclude: ^skills/gtk-rs-new-app/assets/template/
        stages: [manual]
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: ["--force-scope"]
